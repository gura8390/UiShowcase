[package]
name = "ui-showcase"
version = "0.0.2-p1"
edition = "2024"
rust-version = "1.95"
description = "澄明原生工具风 Rust + egui Windows 桌面 UI 设计规范交互展示应用"

[[bin]]
name = "UiShowcase"
path = "src/main.rs"

[dependencies]
eframe = { version = "0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow"] }
image = { version = "0.25", default-features = false, features = ["ico", "png"] }
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winit = "0.30"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = "thin"
strip = "debuginfo"
